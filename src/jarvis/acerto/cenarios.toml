# Cenários do harness de acerto em pt-BR (ADR-0064). Uma fala do dono e o que se espera dela.
# `tipo` diz quem responde (o atalho, o roteador de método, a leitura do sim/não, do teto, da
# nota, ou um motor); `ferramenta`/`args` ou `decisao` dizem o esperado. `nenhuma` = não deve
# responder nada. Os apps e navegadores "instalados" são os do `Ambiente` (jarvis.acerto).
# Mudar um esperado é mudar o comportamento: a mudança vem com a razão no commit.

# --- apps: abrir, fechar, encerrar ---------------------------------------------------------------
