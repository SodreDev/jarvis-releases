[pytest]
testpaths = tests
markers =
    windows_only: teste só é válido/relevante no Windows
    linux_only: teste só é válido/relevante no Linux
    wayland: teste depende de um compositor Wayland (ex.: KWin virtual)
    x11: teste depende de um servidor X11
    needs_display: teste precisa de um display gráfico (X11/Wayland) disponível
    slow: teste demorado (ex.: import de modelos pesados, subprocessos, IO de rede)
