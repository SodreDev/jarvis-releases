# Ferramenta nativa do assistente de voz (dono, 2026-10-18; item 4 do pedido).
id: window.list
title: Listar janelas abertas
description: Lista as janelas abertas (aplicativo, título, id e qual está em primeiro plano). Use quando o dono
  perguntar o que está aberto. Não mostra o conteúdo das janelas e não muda nada; sem o kdotool, no Wayland só
  enxerga as janelas X11 e XWayland.
input_schema:
  type: object
  additionalProperties: false
  properties: {}
output_schema:
  type: object
  required:
  - janelas
preconditions: []
postcondition: a resposta lista as janelas que o gerenciador de janelas informou no instante da chamada
capability: window.list
risk_class: leitura
side_effect: none
reversible: true
idempotent: true
idempotency: not_required
data_egress: none
pii_touch: metadata
confirmation: never
tier: livre
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 3000
cancellable: false
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-desktop
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
