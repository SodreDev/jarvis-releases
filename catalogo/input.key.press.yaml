# Entrada virtual (ADR-0027, fatia 4): mouse e teclado sintetizados pelo sistema, sob o foco da janela.
id: input.key.press
title: Apertar uma tecla ou atalho
description: >-
  Aperta uma tecla ou combinação da lista fechada: letras, dígitos, enter, tab, esc, backspace, delete, space,
  setas, home, end, pageup, pagedown, com ctrl, shift ou alt (ex.: ctrl+l). Não existe super nem ctrl+alt. Enter
  pede o sim do dono. Vale para a janela que está em foco, conferida pelo código antes de cada ação: terminal,
  banco, mensageiro, gerenciador de senhas e janela desconhecida pedem o sim do dono, e o próprio Jarvis em foco
  é recusado. Tem limite de taxa e o dono pode parar tudo. Prefira browser.* quando a página deixar; use isto
  onde o site proíbe automação.
quando: "apertar uma tecla ou atalho no app em foco (só quando não há ferramenta própria)"
exemplos:
- "aperta ctrl+L"
- "dá Enter"
input_schema:
  type: object
  additionalProperties: false
  required:
  - tecla
  properties:
    tecla:
      type: string
      minLength: 1
      maxLength: 30
output_schema:
  type: object
  required:
  - tecla
preconditions:
- o dono ligou a entrada virtual na configuração e deu o consentimento do sistema
- a janela em foco é a que o dono quer controlar
postcondition: a tecla saiu pelo backend de entrada do sistema, sem modificador preso, na janela conferida antes
capability: input.key.press
risk_class: transitorio_reversivel
side_effect: ephemeral
reversible: false
idempotent: false
idempotency: required
data_egress: local
pii_touch: none
confirmation: never
tier: moderado
aviso_falado: Apertei {tecla}.
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 10000
cancellable: true
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-entrada
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
