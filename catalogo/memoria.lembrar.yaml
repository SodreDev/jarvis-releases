# Ferramenta de memória do cérebro (ADR-0026). Só o s2 chama; tarefa, MCP de entrada e Jev não veem.
id: memoria.lembrar
title: Gravar uma memória
description: Grava uma memória nova sobre o dono, ligada ao turno em que ela apareceu. Use quando o dono
  pedir para o Jarvis lembrar de algo. Só nasce ativa se o texto for fala do próprio dono neste turno;
  senão fica proposta. Não grava segredo e não apaga nada.
quando: "guardar um fato curto que o dono pediu para lembrar"
exemplos:
- "lembra que eu tomo café sem açúcar"
input_schema:
  type: object
  additionalProperties: false
  required:
  - texto
  properties:
    texto:
      type: string
      minLength: 1
      maxLength: 2000
    sujeito: &id001
      type: string
      minLength: 1
      maxLength: 128
    predicado: *id001
output_schema:
  type: object
  required:
  - assertion_id
  - estado
preconditions:
- turno corrente do dono como episódio de origem
postcondition: assertiva gravada com source_episode_id do turno corrente
capability: memoria.write.memoria
risk_class: escrita_recuperavel
side_effect: persistent
reversible: true
undo: memoria.retratar
idempotent: false
idempotency: required
data_egress: none
pii_touch: content
confirmation: never
tier: moderado
aviso_falado: 'Anotei: {texto}'
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 500
cancellable: true
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-memoria
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
