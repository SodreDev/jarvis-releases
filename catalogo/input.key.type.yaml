# Entrada virtual (ADR-0027, fatia 4): mouse e teclado sintetizados pelo sistema, sob o foco da janela.
id: input.key.type
title: Digitar texto no teclado
description: >-
  Digita um texto (até 500 caracteres) na janela em foco, tecla por tecla, como o dono faria. Use para preencher
  um campo que já está com o cursor. Não digita senha, código de verificação nem cartão (isso é do dono), e
  quebra de linha (Enter) pede o sim do dono. Vale para a janela que está em foco, conferida pelo código antes
  de cada ação: terminal, banco, mensageiro, gerenciador de senhas e janela desconhecida pedem o sim do dono, e
  o próprio Jarvis em foco é recusado. Tem limite de taxa e o dono pode parar tudo. Prefira browser.* quando a
  página deixar; use isto onde o site proíbe automação.
quando: "digitar no app em foco com o teclado virtual (WhatsApp, Instagram, app sem automação)"
exemplos:
- "digita oi no WhatsApp"
input_schema:
  type: object
  additionalProperties: false
  required:
  - texto
  properties:
    texto:
      type: string
      minLength: 1
      maxLength: 500
output_schema:
  type: object
  required:
  - caracteres
preconditions:
- o dono ligou a entrada virtual na configuração e deu o consentimento do sistema
- a janela em foco é a que o dono quer controlar
postcondition: o texto saiu pelo backend de entrada do sistema, na janela que estava em foco e foi conferida antes
capability: input.key.type
risk_class: transitorio_reversivel
side_effect: ephemeral
reversible: false
idempotent: false
idempotency: required
data_egress: local
pii_touch: content
confirmation: never
tier: moderado
aviso_falado: Digitei o texto.
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 30000
cancellable: true
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-entrada
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
