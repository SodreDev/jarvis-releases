# Ferramenta nativa do assistente de voz (dono, 2026-10-18; item 4 do pedido).
id: files.copy
title: Copiar um arquivo
description: Copia um arquivo comum (até 50 MB) para outro lugar das raízes liberadas. Use quando o dono pedir para
  copiar. Nunca sobrescreve (nome repetido ganha sufixo), não copia pasta inteira e avisa em voz; dá para desfazer.
quando: "copiar um arquivo dentro das pastas liberadas"
exemplos:
- "copia o relatório para Documentos"
input_schema:
  type: object
  additionalProperties: false
  required:
  - origem
  - destino
  properties:
    origem:
      type: string
      minLength: 2
      maxLength: 1024
    destino:
      type: string
      minLength: 2
      maxLength: 1024
output_schema:
  type: object
  required:
  - caminho
  - nome
preconditions: []
postcondition: o arquivo novo existe no destino com o mesmo conteúdo e a origem não mudou
capability: files.copy
risk_class: escrita_recuperavel
side_effect: persistent
reversible: true
undo: acao.desfazer
idempotent: false
idempotency: required
data_egress: none
pii_touch: path_only
confirmation: never
tier: moderado
aviso_falado: Copiei para {nome}.
access_level_min: jarvis
roots:
- jarvis_root
requires_elevation: false
timeout_ms: 10000
cancellable: true
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-files
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
