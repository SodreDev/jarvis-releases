# Ferramenta nativa do assistente de voz (dono, 2026-10-18; item 4 do pedido).
id: timer.alarm.set
title: Marcar alarme ou lembrete
description: 'Marca um alarme ou lembrete: daqui a `em_segundos` ou numa hora (`quando`: HH:MM ou data e hora ISO).
  Na hora, o Jarvis recebe o aviso e fala a mensagem, mesmo com a conversa parada. Use para timers e lembretes.
  Sobrevive a fechar o Jarvis, não toca nada além do aviso e vai até 30 dias.'
quando: "lembrete ou timer: em_segundos para daqui a pouco, quando para uma hora; o sistema fala quando vence"
exemplos:
- "me lembra em dez minutos"
- "timer de cinco minutos"
input_schema:
  type: object
  additionalProperties: false
  required:
  - mensagem
  properties:
    mensagem:
      type: string
      minLength: 3
      maxLength: 200
    em_segundos:
      type: integer
      minimum: 1
      maximum: 2592000
    quando:
      type: string
      minLength: 4
      maxLength: 40
output_schema:
  type: object
  required:
  - alarme_id
  - quando_humano
preconditions: []
postcondition: o alarme está na agenda, gravado em disco, e dispara no instante pedido
capability: timer.alarm.set
risk_class: transitorio_reversivel
side_effect: persistent
reversible: true
undo: timer.alarm.cancel
idempotent: false
idempotency: required
data_egress: none
pii_touch: none
confirmation: never
tier: moderado
aviso_falado: 'Marquei o lembrete para {quando_humano}: {mensagem}.'
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 1000
cancellable: false
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-alarmes
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
