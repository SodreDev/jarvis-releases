# Ferramenta de memória do cérebro (ADR-0026). Só o s2 chama; tarefa, MCP de entrada e Jev não veem.
id: memoria.criar_aresta
title: Ligar duas entidades no grafo
description: Cria uma relação entre duas entidades do grafo, com validade no tempo. Use quando o dono
  contar como duas pessoas ou coisas se relacionam. Só nasce ativa se os dois nomes estiverem na fala
  do dono neste turno; não apaga relação antiga e não cria entidade.
input_schema:
  type: object
  additionalProperties: false
  required:
  - origem
  - relacao
  - destino
  properties:
    origem: &id001
      type: string
      minLength: 1
      maxLength: 128
    relacao: *id001
    destino: *id001
    desde: &id002
      type: string
      format: date-time
    ate: *id002
output_schema:
  type: object
  required:
  - edge_id
  - estado
preconditions:
- origem e destino existem no grafo
postcondition: aresta com source_episode_id e validade
capability: memoria.write.relacao
risk_class: escrita_recuperavel
side_effect: persistent
reversible: true
undo: memoria.retratar
idempotent: false
idempotency: required
data_egress: none
pii_touch: content
confirmation: never
tier: moderado
aviso_falado: 'Anotei a ligação entre {origem} e {destino}.'
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 500
cancellable: true
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-memoria
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
