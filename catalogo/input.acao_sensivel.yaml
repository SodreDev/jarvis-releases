# Entrada virtual (ADR-0027, fatia 4): mouse e teclado sintetizados pelo sistema, sob o foco da janela.
id: input.acao_sensivel
title: Confirmar uma ação sensível de entrada virtual
description: >-
  Pedido interno do Jarvis ao PDP, nunca do modelo: registra e confirma com o dono uma ação de mouse ou teclado
  virtual em terminal, banco, mensageiro, e-mail ou janela de autenticação, ou que aperta Enter. Sempre pede o
  sim do dono, uma vez por ação. Não aparece para o modelo e não executa nada por si.
input_schema:
  type: object
  additionalProperties: false
  required:
  - acao
  - detalhe
  properties:
    acao:
      type: string
      minLength: 3
      maxLength: 40
    detalhe:
      type: string
      minLength: 1
      maxLength: 300
output_schema:
  type: object
  required:
  - confirmado
preconditions:
- o dono está presente na janela
postcondition: o dono confirmou na janela esta ação, e só esta, antes de qualquer evento sintético
capability: input.acao_sensivel
risk_class: representacao_do_dono
side_effect: ephemeral
reversible: false
idempotent: false
idempotency: required
data_egress: network:web
pii_touch: sensitive
confirmation: per_action
tier: perigoso
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 35000
cancellable: true
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-entrada
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
