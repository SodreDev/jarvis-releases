# Ferramenta de memória do cérebro (ADR-0026). Só o s2 chama; tarefa, MCP de entrada e Jev não veem.
id: memoria.retratar
title: Retratar uma memória
description: 'Marca uma memória, entidade ou relação como retratada: o Jarvis deixa de usá-la, mas o rastro
  fica e dá para desfazer. Use quando o dono disser para esquecer algo sem apagar de vez. Não apaga dado
  nenhum e sempre pede confirmação.'
quando: "retirar uma memória que o dono desmentiu"
exemplos:
- "isso não é verdade, esquece"
input_schema:
  type: object
  additionalProperties: false
  required:
  - alvo_id
  properties:
    alvo_id:
      type: string
      minLength: 1
      maxLength: 128
output_schema:
  type: object
  required:
  - alvo_id
  - estado
preconditions:
- alvo existe
postcondition: alvo com status retracted e valid_to
capability: memoria.write.retratacao
risk_class: escrita_recuperavel
side_effect: persistent
reversible: true
undo: memoria.lembrar
idempotent: false
idempotency: required
data_egress: none
pii_touch: content
confirmation: per_action
tier: perigoso
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 500
cancellable: true
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-memoria
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
