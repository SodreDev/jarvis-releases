# Ferramenta nativa do assistente de voz (dono, 2026-10-18; item 4 do pedido).
id: window.focus_app
title: Trazer um aplicativo para a frente
description: Traz para a frente a janela de um aplicativo que já está aberto, pelo nome, ou uma janela exata pelo
  janela_id que o window.list deu. Use quando o dono pedir para ir para o navegador, voltar ao editor e afins. Não
  abre o aplicativo (para isso existe apps.launch, que já põe o app em foco sozinho quando a janela dele abrir) e,
  se mais de um casar, pergunta qual.
input_schema:
  type: object
  additionalProperties: false
  required:
  - app
  properties:
    app:
      type: string
      minLength: 2
      maxLength: 60
    janela_id:
      type: string
      pattern: ^(0x[0-9a-fA-F]{1,8}|\{[0-9a-fA-F-]{36}\})$
output_schema:
  type: object
  required:
  - app
  properties:
    janela_id:
      type: string
preconditions: []
postcondition: a janela escolhida pelo código na lista real (ou a do janela_id, conferida nela) ficou em foco
capability: window.focus_app
risk_class: transitorio_reversivel
side_effect: ephemeral
reversible: false
idempotent: false
idempotency: required
data_egress: none
pii_touch: none
confirmation: never
tier: livre
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 3000
cancellable: false
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-desktop
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
