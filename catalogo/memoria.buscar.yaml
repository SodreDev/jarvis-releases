# Ferramenta de memória do cérebro (ADR-0026). Só o s2 chama; tarefa, MCP de entrada e Jev não veem.
id: memoria.buscar
title: Lembrar o que o Jarvis sabe
description: 'Recupera memórias ativas sobre o dono (fatos, preferências e relações do grafo) para uma
  consulta, com o caminho de cada evidência. Use quando a resposta depende do que o dono já contou. Não
  devolve memória proposta nem vencida e não inventa: sem evidência, diz que não encontrou.'
input_schema:
  type: object
  additionalProperties: false
  required:
  - consulta
  properties:
    consulta:
      type: string
      minLength: 1
      maxLength: 2000
    instante:
      type: string
      format: date-time
output_schema:
  type: object
  required:
  - achados
preconditions: []
postcondition: todo achado traz memory_unit_id e o caminho
capability: memoria.read.memoria
risk_class: leitura
side_effect: none
reversible: true
idempotent: true
idempotency: not_required
data_egress: none
pii_touch: content
confirmation: never
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 300
cancellable: true
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-memoria
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
