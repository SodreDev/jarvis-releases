# Ferramenta nativa do assistente de voz (dono, 2026-10-18; item 4 do pedido).
id: window.close_app
title: Fechar um aplicativo
description: Pede o fechamento da janela de um aplicativo aberto, pelo nome. Use só quando o dono pedir para fechar.
  Pode perder trabalho não salvo, então sempre pede a confirmação do dono; fecha do jeito educado (o aplicativo
  pode perguntar se salva) e nunca mata o processo.
input_schema:
  type: object
  additionalProperties: false
  required:
  - app
  properties:
    app:
      type: string
      minLength: 2
      maxLength: 60
output_schema:
  type: object
  required:
  - app
preconditions: []
postcondition: o gerenciador de janelas recebeu o pedido de fechar a janela escolhida
capability: window.close_app
risk_class: transitorio_reversivel
side_effect: ephemeral
reversible: false
idempotent: false
idempotency: required
data_egress: none
pii_touch: none
confirmation: per_action
tier: perigoso
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 3000
cancellable: false
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-desktop
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
