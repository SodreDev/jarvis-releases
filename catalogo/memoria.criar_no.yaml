# Ferramenta de memória do cérebro (ADR-0026). Só o s2 chama; tarefa, MCP de entrada e Jev não veem.
id: memoria.criar_no
title: Criar uma entidade no grafo
description: Cria uma pessoa, lugar, projeto ou coisa no grafo pessoal, com apelidos. Use quando o dono
  apresentar alguém ou algo novo. Só nasce ativa se o nome estiver na fala do dono neste turno; não duplica
  entidade que já existe e não cria relação.
quando: "registrar uma pessoa, lugar, projeto ou app na memória"
exemplos:
- "guarda que o Kauã é meu sócio"
input_schema:
  type: object
  additionalProperties: false
  required:
  - tipo
  - nome
  properties:
    tipo:
      enum:
      - pessoa
      - lugar
      - projeto
      - app
      - arquivo
      - coisa
    nome: &id001
      type: string
      minLength: 1
      maxLength: 128
    apelidos:
      type: array
      maxItems: 8
      items: *id001
output_schema:
  type: object
  required:
  - entity_id
  - estado
preconditions:
- turno corrente do dono como episódio de origem
postcondition: entidade e apelidos resolvíveis por entity_resolution
capability: memoria.write.entidade
risk_class: escrita_recuperavel
side_effect: persistent
reversible: true
undo: memoria.retratar
idempotent: false
idempotency: required
data_egress: none
pii_touch: content
confirmation: never
tier: moderado
aviso_falado: 'Anotei {nome} como {tipo}.'
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 500
cancellable: true
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-memoria
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
