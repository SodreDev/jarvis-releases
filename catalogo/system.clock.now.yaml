# Ferramenta nativa do assistente de voz (dono, 2026-10-18; item 4 do pedido).
id: system.clock.now
title: Hora e data agora
description: Diz a data e a hora locais de agora, já escritas para falar. Use quando o dono perguntar que horas
  são, que dia é hoje ou o dia da semana. Não consulta a internet, não muda o relógio e não sabe o fuso de outra
  cidade.
quando: "hora e data de agora"
exemplos:
- "que horas são?"
input_schema:
  type: object
  additionalProperties: false
  properties: {}
output_schema:
  type: object
  required:
  - iso
  - hora
  - data_por_extenso
preconditions: []
postcondition: a resposta traz a data e a hora locais do instante da chamada
capability: system.clock.now
risk_class: leitura
side_effect: none
reversible: true
idempotent: true
idempotency: not_required
data_egress: none
pii_touch: none
confirmation: never
tier: livre
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 500
cancellable: false
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-sistema
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
