# Ferramenta de memória do cérebro (ADR-0026). Só o s2 chama; tarefa, MCP de entrada e Jev não veem.
id: memoria.apagar
title: Apagar de vez
description: 'Apaga de vez um turno, uma sessão de conversa ou uma memória, em cascata: bruto, índice,
  busca textual e o grafo que só ele sustentava. Use só quando o dono pedir para apagar definitivamente.
  Não tem desfazer e nunca roda sem confirmação na tela, uma por vez.'
quando: "apagar algo da memória; o sistema pergunta antes"
exemplos:
- "esquece o que eu disse sobre a viagem"
input_schema:
  type: object
  additionalProperties: false
  required:
  - alvo_id
  - escopo
  properties:
    alvo_id:
      type: string
      minLength: 1
      maxLength: 128
    escopo:
      enum:
      - turno
      - sessao
      - memoria
output_schema:
  type: object
  required:
  - removidos
preconditions:
- alvo existe
postcondition: varredura de bruto, FTS, índice e grafo não acha o alvo
capability: memoria.write.exclusao
risk_class: apagar_permanente
side_effect: persistent
reversible: false
idempotent: false
idempotency: required
data_egress: none
pii_touch: content
confirmation: per_action
tier: perigoso
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 500
cancellable: true
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-memoria
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
