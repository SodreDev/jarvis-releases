# Ferramenta nativa do assistente de voz (dono, 2026-10-18; item 4 do pedido).
id: files.move
title: Mover ou renomear
description: Move ou renomeia um arquivo ou pasta dentro da mesma raiz liberada. Use quando o dono pedir para mover
  ou renomear. Nunca sobrescreve (nome repetido ganha sufixo), não sai de uma raiz para outra (para isso, copie)
  e avisa em voz; dá para desfazer.
quando: "mover um arquivo dentro das pastas liberadas"
exemplos:
- "move a foto para Imagens"
input_schema:
  type: object
  additionalProperties: false
  required:
  - origem
  - destino
  properties:
    origem:
      type: string
      minLength: 2
      maxLength: 1024
    destino:
      type: string
      minLength: 2
      maxLength: 1024
output_schema:
  type: object
  required:
  - de
  - para
  - nome
preconditions: []
postcondition: o item está no destino e saiu da origem, na mesma raiz
capability: files.move
risk_class: escrita_recuperavel
side_effect: persistent
reversible: true
undo: acao.desfazer
idempotent: false
idempotency: required
data_egress: none
pii_touch: path_only
confirmation: never
tier: moderado
aviso_falado: Movi para {nome}.
access_level_min: jarvis
roots:
- jarvis_root
requires_elevation: false
timeout_ms: 3000
cancellable: false
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-files
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
