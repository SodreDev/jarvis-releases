# Ferramenta real do catálogo v1 (SPEC §5.6, fatia 6 da F2; pedido do dono de 2026-10-17).
id: sites.open
title: Abrir um site
description: >-
  Abre um endereço http ou https no navegador principal que o dono configurou (ou no padrão do desktop, se ele
  não configurou). Use quando o dono pedir para abrir uma página; só diga `navegador` se ele pedir um navegador
  específico e for um dos que ele configurou. `reutilizar_aba` é verdadeiro por padrão: reutilize a aba atual
  quando o navegador oferecer essa capacidade; sem ela, abra como antes. Abre sem perguntar; só confirma, na tela,
  se neste turno você leu um arquivo ou página e o endereço não é de um site que o dono liberou. Não lê a página,
  não controla o navegador, não abre outro esquema (arquivo, javascript, dados) e não aceita URL com senha.
input_schema:
  type: object
  additionalProperties: false
  required:
  - url
  properties:
    url:
      type: string
      minLength: 8
      maxLength: 2048
    navegador:
      type: string
      maxLength: 40
    reutilizar_aba:
      type: boolean
output_schema:
  type: object
  required:
  - url
  - dominio
preconditions:
- url http(s) com host e sem credencial
postcondition: o navegador configurado (ou o portal do desktop) aceitou abrir a URL
capability: sites.open
risk_class: transitorio_reversivel
side_effect: ephemeral
reversible: false
idempotent: false
idempotency: required
data_egress: local
pii_touch: metadata
confirmation: never
tier: livre
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 3000
cancellable: false
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-portal
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
