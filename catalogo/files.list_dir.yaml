# Ferramenta real do catálogo v1 (SPEC §5.6, fatia 6 da F2). Corpo em jarvis.executor.
id: files.list_dir
title: Listar uma pasta
description: 'Lista o que há numa pasta dentro das raízes que o modo de acesso do dono libera: nome, tipo
  e tamanho, até 200 entradas. Use quando o dono perguntar o que tem numa pasta. Não lê o conteúdo dos
  arquivos, não sai das raízes e não mostra chaves, cofres nem pastas negadas.'
input_schema:
  type: object
  additionalProperties: false
  required:
  - path
  properties:
    path:
      type: string
      minLength: 1
      maxLength: 1024
output_schema:
  type: object
  required:
  - entradas
preconditions:
- path dentro de uma raiz do modo
- path é pasta
postcondition: entradas são filhas diretas da pasta pedida, sem as negadas
capability: files.read.list
risk_class: leitura
side_effect: none
reversible: true
idempotent: true
idempotency: not_required
data_egress: none
pii_touch: path_only
confirmation: never
tier: livre
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 2000
cancellable: true
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-files
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
