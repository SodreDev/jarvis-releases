id: tarefa.estado
title: Estado das tarefas
description: Diz como estão as tarefas em segundo plano (rodando, esperando o sim do dono, concluída, falhou, cancelada) e o
  progresso. Use quando o dono perguntar como está a tarefa. Sem `tarefa_id` lista as mais recentes. Não inicia nem
  cancela nada e não mostra o conteúdo que a tarefa leu.
quando: "como está uma tarefa em segundo plano"
exemplos:
- "terminou aquilo?"
input_schema:
  type: object
  additionalProperties: false
  properties:
    tarefa_id:
      type: string
      minLength: 3
      maxLength: 40
output_schema:
  type: object
  required:
  - tarefas
preconditions: []
postcondition: o estado devolvido reflete o das tarefas no instante da chamada
capability: tarefa.estado
risk_class: leitura
side_effect: none
reversible: true
idempotent: true
idempotency: not_required
data_egress: none
pii_touch: none
confirmation: never
tier: livre
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 500
cancellable: false
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-tarefas
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
