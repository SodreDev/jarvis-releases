# Entrada virtual (ADR-0027, fatia 4): mouse e teclado sintetizados pelo sistema, sob o foco da janela.
id: input.mouse.click
title: Clicar com o mouse
description: >-
  Clica com o botão esquerdo, direito ou do meio onde o ponteiro está, de 1 a 3 vezes. Use depois de posicionar
  o ponteiro com input.mouse.move. Não escolhe o lugar do clique. Vale para a janela que está em foco, conferida
  pelo código antes de cada ação: terminal, banco, mensageiro, gerenciador de senhas e janela desconhecida pedem
  o sim do dono, e o próprio Jarvis em foco é recusado. Tem limite de taxa e o dono pode parar tudo. Prefira
  browser.* quando a página deixar; use isto onde o site proíbe automação.
input_schema:
  type: object
  additionalProperties: false
  properties:
    botao:
      type: string
      enum: ["esquerdo", "direito", "meio"]
    vezes:
      type: integer
      minimum: 1
      maximum: 3
output_schema:
  type: object
  required:
  - botao
  - vezes
preconditions:
- o dono ligou a entrada virtual na configuração e deu o consentimento do sistema
- a janela em foco é a que o dono quer controlar
postcondition: o clique saiu pelo backend de entrada do sistema, com a janela em foco conferida antes
capability: input.mouse.click
risk_class: transitorio_reversivel
side_effect: ephemeral
reversible: false
idempotent: false
idempotency: required
data_egress: local
pii_touch: none
confirmation: never
tier: moderado
aviso_falado: Cliquei com o botão {botao}.
access_level_min: jarvis
roots: []
requires_elevation: false
timeout_ms: 10000
cancellable: true
platforms:
- linux-wayland
- linux-x11
- windows
executor: local-entrada
trust_input: untrusted
tests:
- contract
- postcondition
- denial
version: 1
