name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # P11: o que não roda nos dois sistemas não fecha tarefa.
  verificacao:
    name: verificação (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A suíte leva ~14 min no Ubuntu; um teste preso não pode segurar o runner por 6 h.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Os testes da janela desenham em memória (ADR-0019); sem isto o Qt procura um display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      # O runner Ubuntu não traz as bibliotecas de sistema que o PySide6 carrega ao importar
      # QtGui (libEGL, libGL, xkbcommon, fontconfig, dbus): sem elas a coleta de
      # tests/unit/gui cai com `ImportError: libEGL.so.1`. O `ffmpeg` é dependência de verdade
      # do caminho de voz do Edge (decodifica o MP3; ADR-0017) e os testes dele o pedem.
      - name: dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64 \
            ffmpeg

      - name: instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.29"
          enable-cache: true

      - name: sincronizar ambiente (Python 3.12 do projeto)
        # O grupo `gui` entra no CI porque a janela tem teste: ele desenha as três telas
        # em `QT_QPA_PLATFORM=offscreen` e falha se o QML tiver um erro sequer (ADR-0019).
        # O `memoria` entra porque o gate 2 (exclusão em cascata) é testado no índice de
        # verdade (LanceDB), não só no falso.
        run: uv sync --frozen --group dev --group gui --group memoria

      - name: formatação
        run: uv run --frozen ruff format --check .

      - name: linter
        run: uv run --frozen ruff check --output-format=github .

      - name: tipos
        run: uv run --frozen mypy

      - name: testes
        run: uv run --frozen pytest

      # Cartão F0-10: decisão com número traz hardware, n, data e commit.
      - name: procedência das ADRs
        run: uv run --frozen python tools/adr.py conferir

      # Cartão F0-08: medição só continua comparável se o corpus for o mesmo.
      - name: corpus confere com o manifesto
        run: uv run --frozen python tools/corpus.py verificar

      # SPEC §4: manifesto é verificado por máquina, e stub velho não entra.
      - name: manifestos e catálogo
        run: |
          uv run --frozen python tools/manifesto.py validar
          uv run --frozen python tools/manifesto.py lint
          uv run --frozen python tools/manifesto.py conferir

      # ADR-0011: nada não comercial entra. Roda offline, com a tabela comitada.
      - name: porta de licença
        run: |
          uv run --frozen python tools/license_gate.py --verificar-tabela --tabela
          uv run --frozen python tools/license_gate.py --verificar-atribuicao
