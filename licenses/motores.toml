fonte_dos_modelos = "https://elevenlabs.io/docs/models"
data_dos_modelos = "2026-10-16"
nota_dos_modelos = """Só entram modelos que a página de modelos dá com português E pelo \
endpoint de Text to Speech que este motor usa: `eleven_flash_v2_5` (padrão desde \
2026-10-16, ~75 ms, "real-time applications"), `eleven_multilingual_v2` ("Portuguese (Brazil, \
Portugal)", o padrão até então) e \
`eleven_v3` ("can also be used with the Text to Speech API", geração anterior). Fora, com \
o motivo: `eleven_v4` e `eleven_v4_turbo` (a página os dá pela Text to Dialogue API / \
WebSocket, não pelo endpoint deste motor), `eleven_v3_conversational` (Text to Dialogue \
WebSocket), `eleven_turbo_v2_5` e `eleven_turbo_v2` (deprecated), `eleven_flash_v2` (só \
inglês), `eleven_multilingual_v1` (só na tabela de limites, sem idioma documentado). Mesmo \
serviço e mesmos termos para todos: trocar de modelo não muda o que sai nem para onde."""
nota = """Termos \"Last Updated: 09 October 2026\". O produto pede `output_format=pcm_16000`, \
que casa com o contrato de 16 kHz PCM16 mono do caminho de áudio sem reamostrar. A retenção \
declarada é o campo que o dono precisa ler **antes** de ligar: no plano dele, o texto falado \
fica no histórico da conta."""

