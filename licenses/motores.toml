# Registro de motores de voz: licença do cliente, onde roda e — para nuvem — os termos
# verificados na origem (ADR-0017).
#
# Por que existe um terceiro registro, além de `modelos.toml` e `ferramentas-externas.toml`:
# um motor de nuvem não tem peso para licenciar nem binário para inventariar. O que ele tem é
# **contrato de serviço**, e é isso que o dono precisa ver antes de o áudio dele sair da
# máquina. As quatro perguntas são sempre as mesmas, e são campos, não prosa:
#
#   uso_comercial · retencao_declarada · treina_com_entrada · dono_da_saida
#
# Regras que o portão impõe (`jarvis.voz.registro.exigir_motor`, `tools/license_gate.py`):
#
#   - motor não registrado **não carrega** (mesma regra da voz, ADR-0012);
#   - `onde = "nuvem"` nasce com `ligado = false`: sem interruptor do dono, o produto não abre
#     socket para transcrever nem para falar (ADR-0017, política 1);
#   - campo obrigatório vazio **barra** o motor: no v0, "não verificado" não liga nuvem
#     (ADR-0017, política 4). É o que mantém o `tts-edge` fora até o dono decidir;
#   - `marca_dagua` é declaração obrigatória: áudio que sai marcado é fato do produto
#     (ADR-0017, política 5);
#   - licença não permissiva do **cliente** bloqueia como qualquer dependência (ADR-0011).
#
# `fonte` é a página oficial do serviço ou o registro oficial do pacote — nunca agregador.

data_da_verificacao = "2026-10-15"
verificado_por = "executor"

