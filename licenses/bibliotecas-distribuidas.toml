# Bibliotecas que o **produto distribui** dentro do pacote, com licença verificada na origem
# (ADR-0011, ADR-0012, ADR-0019, ADR-0020).
#
# Por que mais um registro, além de `modelos.toml` e `ferramentas-externas.toml`: até a
# ADR-0019 nenhuma dependência saía desta máquina. Com AppImage, .deb e .rpm, o Jarvis passa a
# **redistribuir** binários de terceiros — e aí a pergunta deixa de ser só "esta licença
# permite uso comercial?" e passa a incluir "o que ela me obriga a entregar junto?".
#
# O portão (`tools/license_gate.py`) cobra, por item em uso:
#   - a licença escolhida tem de estar na expressão publicada pela origem;
#   - copyleft forte em uso bloqueia, como já bloqueia em ferramenta externa;
#   - ligação estática ou biblioteca modificada em item copyleft (LGPL incluído) bloqueia:
#     as duas destroem o direito de re-ligar, que é a obrigação central do LGPL;
#   - o texto da licença tem de existir no repositório (`licenses/texto/`), porque é ele que
#     o `tools/empacotar.py` copia para dentro do artefato;
#   - a licença que o pacote instalado declara nos metadados tem de bater com a registrada
#     aqui — se o item não estiver instalado nesta máquina, a conferência **diz isso** em vez
#     de passar calada;
#   - o `NOTICE` tem de citar o item e a licença escolhida.

data_da_verificacao = "2026-10-16"
verificado_por = "executor"

