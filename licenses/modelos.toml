# Registro de modelos: licença, origem e data de acesso (ADR-0011, cartão F0-09).
#
# A porta de licença (`tools/license_gate.py`) lê este arquivo e falha em qualquer item
# não comercial ou "research only" que não esteja marcado como `barrado`.
#
# Regra de preenchimento: a licença vem do **model card oficial** do repositório do modelo
# (API do Hugging Face ou arquivo LICENSE do repositório de origem), nunca de agregador ou
# diretório de terceiro. `revisao` é o commit do repositório do modelo no momento da
# consulta — é o que torna a verificação repetível.
#
# Estados: `candidato` (pode ser medido), `em_uso` (está no caminho do produto),
# `barrado` (verificado e recusado; fica registrado para ninguém tentar de novo),
# `uso_pessoal` (não comercial, **fora** do produto: nunca dependência, nunca no pacote, nunca
# padrão; o dono instala para si — ADR-0039). Modelo `uso_pessoal` não tem `baixar_de` (o
# download do produto) e sim `instalar_de`, que só o instalador de `tools/` lê; a porta de
# licença confere que ele continua fora do caminho do produto e falha se entrar.

data_da_verificacao = "2026-10-15"
verificado_por = "executor"

