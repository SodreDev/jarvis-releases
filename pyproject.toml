[project]
name = "jarvis"
version = "0.0.0"
description = "Assistente pessoal desktop com voz bidirecional, Linux (Wayland e X11) e Windows"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SodreDev" }]
dependencies = [
  # Validação de schema na borda do barramento (§3.1). MIT.
  "jsonschema>=4.23,<5",
  # Manifesto de capacidade em YAML (§4). MIT.
  "pyyaml>=6.0,<7",
  # AEC/NR/AGC do `audio-io` (cartão F1-04). BSD-3, com roda para Linux e Windows em
  # CPython 3.12 — o que os candidatos do cartão NÃO tinham: `webrtc-audio-processing` no
  # PyPI parou em 2018 (sem roda para 3.12, nem Windows) e `speexdsp` só tem sdist e faz
  # supressão de ruído, não AEC. Por isso a cadeia é nossa, em numpy.
  "numpy>=2.1,<3",
]

[dependency-groups]
# Só para os harness de medição (cartões F0-04 e F0-05). NÃO entra no CI nem no produto:
# instalar com `uv sync --group medicao`. A decisão D1 (linguagem do núcleo) é o que define
# o que vira dependência de verdade.
medicao = [
  "onnxruntime>=1.20,<2",
]
# Só para gerar o corpus sintético (cartão F1-02): a voz piper é um .onnx lido pelo
# onnxruntime (MIT) e a reamostragem 22 050 → 16 000 Hz é numpy (BSD-3). NÃO entra no CI nem
# no produto: `uv sync --group corpus`. O fonemizador (espeak-ng, GPL-3.0) é binário do
# sistema e está registrado em licenses/ferramentas-externas.toml como fora do produto.
corpus = [
  "onnxruntime>=1.20,<2",
]
# Só para medir o ASR (cartão F1-06): runtime do whisper em CTranslate2. NÃO entra no CI nem
# no produto — a escolha do ASR do v1 é do F1-16, depois do WER em voz real.
# faster-whisper MIT, ctranslate2 MIT, tokenizers Apache-2.0, av BSD-3 (FFmpeg LGPL).
asr = [
  "faster-whisper>=1.1,<2",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
  "types-pyyaml>=6.0,<7",
]
# Caminho de voz **local** do aplicativo (ADR-0016 opção B, ADR-0017): voz do piper lida pelo
# onnxruntime (MIT) e fonemização pt-BR por `epitran` (MIT) — sem espeak-ng, sem GPL. NÃO entra
# no CI: `uv sync --group voz`. O CI roda com o motor paramétrico, que não tem fonema.
voz = [
    "epitran>=1.35,<2",
    "onnxruntime>=1.20,<2",
]
# Motor de TTS do Edge (ADR-0017): **extra isolado**, LGPL-3.0, que o portão recusa por
# padrão (o serviço não publica termos). Só é instalado por quem vai testá-lo, nunca é
# dependência do produto e nunca é distribuído junto. Precisa também do ffmpeg do sistema,
# porque o serviço só devolve MP3.
edge = [
    "edge-tts>=7.3,<8",
]
# A janela do aplicativo (ADR-0019): Qt 6 por PySide6, só linkagem dinâmica, sem alterar o
# Qt. `PySide6-Essentials` em vez do `PySide6` inteiro porque o produto usa QtWidgets, QtGui,
# QtCore e QtSvg — os extras (WebEngine, 3D, Charts) não entram no pacote nem no disco do dono.
# Fixado em 6.9.x porque a partir de 6.10 a roda do Linux é `manylinux_2_34`: subir de versão
# subiria o piso de glibc de 2.28 (Debian 10+, Ubuntu 18.10+, RHEL 8+) para 2.34 (Debian 12+,
# Ubuntu 22.04+), e isso é decisão de alcance, não de gosto — ver ADR-0019.
# `keyring` (MIT) guarda a chave de API no chaveiro do SO pelo Secret Service (libsecret,
# KWallet), via `SecretStorage` (BSD-3) e `jeepney` (MIT): nenhuma delas é copyleft.
gui = [
    "PySide6-Essentials>=6.9.3,<6.10",
    "keyring>=25.6,<26",
]
# Abertura de dispositivo real de áudio no aplicativo de teste (`jarvis-voz`): sounddevice
# (MIT) sobre PortAudio (MIT com pedidos não vinculantes). No Linux o PortAudio é biblioteca
# do **sistema** e não vem na roda do PyPI — ver docs/COMO-TESTAR.md. NÃO entra no CI, que
# tem `CI=1` e por isso não abre placa de som nem por acidente (F1-01).
dispositivo = [
    "sounddevice>=0.5,<1",
]

[project.scripts]
# A janela (ADR-0019): `uv run jarvis`. É o que o ícone e o menu de aplicativos abrem.
jarvis = "jarvis.gui.principal:main"
# O aplicativo de teste do dono no terminal (ADR-0017, ADR-0018): `uv run jarvis-voz`.
jarvis-voz = "jarvis.voz.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.uv]
# A versão do núcleo é a decisão D1 (SPEC §2, cartão F0-04). Até lá: 3.12 fixo,
# com a fronteira do barramento em arquivos de dados (schemas/) para que uma
# reimplementação em outra linguagem use o mesmo contrato sem tradução.
required-version = ">=0.5"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # bugbear
  "SIM",       # simplify
  "ANN",       # anotações obrigatórias (tipos fechados, SPEC §3)
  "S",         # bandit: barra shell irrestrito e exec (SPEC §4, proibição de canivete suíço)
  "PTH",       # pathlib em vez de os.path (portabilidade, P11)
  "RUF",
]
ignore = [
  "ANN401",  # Any explícito é permitido em payload cru vindo de fora
  "S101",    # assert
  # Docs e docstrings são em português: travessão, aspas curvas e acento não são ambiguidade.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Os testes podem usar subprocess para provar os portões (lint, licença, epoch).
# S311: o áudio de teste do F1-01 sai de `random.Random(semente)` — determinismo, não
# criptografia. A proibição que importa (shell, exec) continua valendo nos testes.
"tests/*" = ["S603", "S404", "S607", "S311"]
"tools/*" = ["S603", "S404"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# onnxruntime não publica stubs e só existe nos grupos opcionais (`medicao`, `corpus`, `voz`),
# que o CI não instala. numpy virou dependência do produto na F1-04 e traz os próprios tipos,
# por isso saiu desta lista. `epitran` e `edge_tts` entram pelo mesmo motivo: extra opcional
# sem `py.typed`, importado dentro do método que precisa dele.
[[tool.mypy.overrides]]
module = [
  "onnxruntime",
  "onnxruntime.*",
  "faster_whisper",
  "faster_whisper.*",
  "epitran",
  "epitran.*",
  "edge_tts",
  "edge_tts.*",
  "sounddevice",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  # Cartão F1-11: a suíte de cancelamento é o aceite (b) da F1 e roda como portão próprio no
  # `tools/verificar.py`, para virar regressão em vez de evento único.
  "cancelamento: suíte de cancelamento em 20 pontos (cartão F1-11)",
]
