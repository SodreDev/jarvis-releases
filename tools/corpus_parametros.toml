# Corpus do avaliador de parâmetros (ADR-0071): falas do dono em pt-BR, como a transcrição da voz
# entrega (minúsculas, quase sem pontuação, às vezes com palavra trocada), e o que o Jarvis tem de
# decidir em cada uma. `tools/avaliar_parametros.py` lê isto.
#
# espera:
#   memoria     — guardar algo: memoria.lembrar (ou criar_no/criar_aresta) com `memoria_contem`;
#                 `memoria_texto` é o trecho exato que o motor falso grava (a política da ADR-0026
#                 só deixa ativa a memória com palavras do dono)
#   envio       — mandar mensagem: a conversa `conversa` recebe uma mensagem com `mensagem_contem`
#   clique      — abrir a conversa `conversa`, sem mandar nada
#   envio_e_memoria — as duas coisas
#   pergunta    — ambíguo ou inexistente: não manda nada, não abre a conversa errada, e pergunta
#   ferramenta  — a 1ª ação é `ferramenta`, com o argumento `argumento` contendo `contem`
#   conversa    — só conversa: nenhuma ação
# proibido_em_argumento: trechos da fala que NÃO podem aparecer em nenhum argumento (a cópia).
#
# As conversas da página falsa do WhatsApp: Mãe, Pai, Bruno, Carla, Ana Paula, Ana Clara,
# Trabalho, Vó Lúcia. Memórias fixas: Mãe («minha mãe»), Bruno («meu irmão»).

[[caso]]
id = "print-do-dono"
fala = "o contato da minha mãe é literalmente mãe salve para não esquecer depois"
espera = "memoria"
memoria_texto = "o contato da minha mãe é literalmente mãe"
memoria_contem = ["mae"]
proibido_em_argumento = ["salve para nao esquecer", "esquecer depois"]
nota = "o caso do print (2026-11-16): sem pontuação"

