# Conjunto do agente do canal do dono (ADR-0074), escrito em 2026-11-17 ANTES de qualquer passada
# com modelo real: os alvos abaixo foram fixados e commitados antes de rodar. Uma passada; nada se
# ajusta olhando este conjunto.
#
# Cada [[caso]] é uma página FALSA do WhatsApp Web (a lista de conversas), o nome do chat do dono
# como ele configurou, e um ou mais eventos da chamada (ação pendente ou aviso) que o agente tem de
# levar ao dono — achando o chat LENDO a lista. Opcionalmente, depois, o dono (ou um terceiro)
# responde. Nada real: página, relógio, histórico de envios e motor de ações são falsos.
#
# Campos:
# - `contato`: o `contato_do_dono_whatsapp` configurado;
# - `[[caso.conversa]]`: `id`, `nome`, `previa`, `grupo` (opcional);
# - `eventos`: lista de "acao" (uma ação pendente nova) ou "aviso" (aviso urgente sem ação);
# - `deve_enviar_em`: o id em que TODAS as mensagens têm de sair; vazio = nenhuma pode sair;
# - `deve_avisar_jarvis`: se o agente tem de chamar canal.avisar_jarvis ao enviar (true/false;
#   ausente = tanto faz);
# - `resposta`: o que o dono escreve no chat dele depois ({C1}, {C2} = os códigos das ações);
# - `resposta_de`: em que conversa a resposta aparece (padrão: `deve_enviar_em`);
# - `estado_final`: o estado esperado de cada ação, na ordem (pendente/confirmada/recusada).
# Sempre conferido: mensagem fora do chat do dono = falha; toda mensagem de ação traz o código dela.

