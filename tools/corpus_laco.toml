# Conjunto NOVO do laço canônico (ADR-0072), escrito em 2026-11-16 DEPOIS da Fase B e ANTES de
# qualquer passada com modelo real: os alvos abaixo foram fixados e commitados antes de rodar.
# Regra: uma passada por modelo, e nada se ajusta olhando este conjunto — se ele cair, o conserto
# vai na causa (esquema, prompt, laço) e é medido de novo num conjunto separado.
#
# Mesma página falsa dos outros conjuntos (conversas: Mãe, Pai, Bruno, Carla, Ana Paula, Ana Clara,
# Trabalho, Vó Lúcia; memórias fixas: Mãe «minha mãe», Bruno «meu irmão»). Campos novos:
# - `recebidas`: a última mensagem que a pessoa mandou, visível na leitura da conversa aberta;
# - `maquina`: a máquina falsa dos testes de fechar/encerrar (janelas e processos: Discord, Steam,
#   Kate, VLC, Firefox). Apagar arquivo NÃO entra: `files.move_to_trash` não tem corpo nesta
#   versão (o manifesto existe e a ferramenta não chega ao modelo);
# - `sem_pergunta`: a ação NÃO pode pedir o sim (só matar/encerrar e apagar pedem);
# - `nao_agir`: nada além de leitura e consulta pode rodar (o pedido é ambíguo demais);
# - `ideal_args`: os argumentos que o motor FALSO ideal usa para validar o avaliador (não é alvo).
# Tipos novos: `permissao` (a ação destrutiva é proposta e o sim é pedido, sem executar antes),
# `leitura` (abre a conversa, lê e responde com o que leu, sem mandar nada) e `delegacao` (vai ao
# subagente com a etapa formulada, não a fala copiada, e o resultado volta).

# --- memória e fatos pessoais ---------------------------------------------------------------------
[[caso]]
