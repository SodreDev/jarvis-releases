# Conjunto de VALIDAÇÃO do avaliador de parâmetros (ADR-0071), separado do corpus de ajuste
# (`tools/corpus_parametros.toml`). Escrito em 2026-11-16, DEPOIS do ajuste de esquemas e prompt e
# ANTES de qualquer passada com estas falas; os alvos abaixo foram fixados antes de rodar. Regra:
# uma passada por modelo, e nada se ajusta olhando este conjunto — se ele cair, o conserto vai na
# causa e é medido de novo no corpus de ajuste, nunca aqui.
#
# Mesmo formato e mesma página falsa do corpus de ajuste (conversas: Mãe, Pai, Bruno, Carla, Ana
# Paula, Ana Clara, Trabalho, Vó Lúcia; memórias fixas: Mãe «minha mãe», Bruno «meu irmão»).

[[caso]]
id = "v-salva-nome-irma"
fala = "o nome da minha irmã no zap é carla salva aí"
espera = "memoria"
memoria_texto = "o nome da minha irmã no zap é carla"
memoria_contem = ["carla"]
proibido_em_argumento = ["salva ai"]

