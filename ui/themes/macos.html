<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S — macOS Glass</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   J.A.R.V.I.S — Tema macOS Glass (dashboard moderno, vidro fosco)
   ═══════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:    #04060a;
  --bg-mid:     #0a0f1a;
  --glass:      rgba(255,255,255,0.035);
  --glass-2:    rgba(255,255,255,0.06);
  --stroke:     rgba(255,255,255,0.08);
  --stroke-hi:  rgba(255,255,255,0.14);
  --txt:        #e8edf5;
  --txt-mute:   #8e96a8;
  --cyan:       #5ad8ff;
  --purple:     #a78bfa;
  --green:      #3cff7c;
  --pink:       #ff6b9e;
  --orange:     #ffb054;
  --shadow:     0 16px 60px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter",
               "Segoe UI", system-ui, sans-serif;
  color: var(--txt);
  background: var(--bg-deep);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01","cv11";
}

/* Fundo: gradiente estático leve (sem animação pesada) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(closest-side at 18% 22%, rgba(26,77,122,0.55) 0%, transparent 55%),
              radial-gradient(closest-side at 82% 78%, rgba(74,30,110,0.50) 0%, transparent 55%),
              radial-gradient(closest-side at 75% 18%, rgba(14,110,142,0.35) 0%, transparent 50%);
  filter: blur(40px); opacity: .65;
  will-change: auto;
}

/* ─── LAYOUT ──────────────────────────────────────────────────────────── */
#shell {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: grid;
  grid-template-columns: 76px 1fr 420px;
  grid-template-rows: 58px 1fr;
  gap: 14px;
  padding: 14px;
}

/* Rail esquerdo */
#rail {
  grid-column: 1; grid-row: 1 / span 2;
  background: var(--glass);
  border: 1px solid var(--stroke);
  border-radius: 22px;
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  display: flex; flex-direction: column; align-items: center;
  padding: 18px 0; gap: 8px;
  box-shadow: var(--shadow);
}
.rail-logo {
  width: 44px; height: 44px; border-radius: 14px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 18px; color: #021;
  box-shadow: 0 4px 16px rgba(90,216,255,0.4);
  margin-bottom: 14px;
}
.rail-btn {
  width: 44px; height: 44px; border-radius: 12px;
  background: transparent; border: 1px solid transparent;
  color: var(--txt-mute);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer;
  transition: all .25s cubic-bezier(.4,0,.2,1);
}
.rail-btn:hover, .rail-btn.active {
  background: var(--glass-2); border-color: var(--stroke-hi);
  color: var(--cyan); transform: translateY(-1px);
}
.rail-spacer { flex: 1; }

/* Topbar */
#topbar {
  grid-column: 2 / span 2; grid-row: 1;
  background: var(--glass);
  border: 1px solid var(--stroke);
  border-radius: 18px;
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  display: flex; align-items: center; padding: 0 22px; gap: 18px;
  box-shadow: var(--shadow);
}
.greet { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.greet small { color: var(--txt-mute); font-weight: 400; margin-left: 8px; font-size: 13px; }
.topbar-spacer { flex: 1; }
.status-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px;
  background: var(--glass-2); border: 1px solid var(--stroke);
  border-radius: 999px; font-size: 12px; color: var(--txt-mute);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green);
              box-shadow: 0 0 12px var(--green); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
.mono { font-family: "SF Mono","JetBrains Mono","Cascadia Code", monospace; font-variant-numeric: tabular-nums; }
.clock { font-size: 14px; color: var(--txt); padding: 0 6px; }
.btn-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--glass-2); border: 1px solid var(--stroke);
  color: var(--txt); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.btn-icon:hover { background: var(--glass); border-color: var(--cyan); color: var(--cyan); }

/* Main (dashboard cards) */
#main {
  grid-column: 2; grid-row: 2;
  overflow-y: auto; padding-right: 4px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  align-content: start;
}
#main::-webkit-scrollbar { width: 8px; }
#main::-webkit-scrollbar-thumb { background: var(--glass-2); border-radius: 4px; }

.card {
  background: var(--glass);
  border: 1px solid var(--stroke);
  border-radius: 22px;
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  padding: 20px; box-shadow: var(--shadow);
  transition: transform .3s cubic-bezier(.4,0,.2,1), border-color .3s;
}
.card:hover { transform: translateY(-2px); border-color: var(--stroke-hi); }
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.card-title { font-size: 11px; font-weight: 600; letter-spacing: 2px;
              color: var(--txt-mute); text-transform: uppercase; }
.card-icon { width: 32px; height: 32px; border-radius: 10px;
             background: var(--glass-2); display: flex; align-items: center;
             justify-content: center; font-size: 14px; }
.card-wide { grid-column: 1 / span 2; }

/* Rings sistema */
.rings { display: flex; gap: 22px; align-items: center; justify-content: space-around; }
.ring-wrap { text-align: center; }
.ring {
  width: 88px; height: 88px; border-radius: 50%;
  background: conic-gradient(from -90deg, var(--cyan) 0%, rgba(255,255,255,0.06) 0);
  display: flex; align-items: center; justify-content: center;
  position: relative; margin: 0 auto 8px; transition: background .6s;
}
.ring::before {
  content: ""; position: absolute; inset: 8px; border-radius: 50%;
  background: var(--bg-mid);
}
.ring span { position: relative; font-size: 18px; font-weight: 700;
             font-variant-numeric: tabular-nums; }
.ring-label { font-size: 10px; letter-spacing: 1.5px; color: var(--txt-mute);
              text-transform: uppercase; }

/* Log feed */
#log-area { max-height: 220px; overflow-y: auto;
            font-family: "SF Mono","JetBrains Mono", monospace; font-size: 11.5px;
            line-height: 1.6; }
.jb-log-row { display: flex; gap: 10px; padding: 4px 0;
              border-bottom: 1px dashed rgba(255,255,255,0.04); }
.jb-log-t { color: var(--cyan); flex-shrink: 0; }
.jb-log-m { color: var(--txt-mute); word-break: break-word; }

/* Quick actions */
.qa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qa-btn {
  padding: 14px 12px;
  background: var(--glass-2); border: 1px solid var(--stroke);
  border-radius: 14px; color: var(--txt); cursor: pointer;
  text-align: left; font-size: 13px; font-weight: 500;
  transition: all .2s;
  display: flex; align-items: center; gap: 10px;
}
.qa-btn:hover { background: var(--glass); border-color: var(--cyan); transform: translateY(-1px); }
.qa-btn span:first-child { font-size: 18px; }
.qa-btn svg { color: var(--cyan); flex-shrink: 0; }
.rail-btn svg, .btn-icon svg, #mic-btn svg { display: block; }
.card-icon svg { color: var(--cyan); }

/* Chat panel direito */
#chat-panel {
  grid-column: 3; grid-row: 2;
  background: var(--glass);
  border: 1px solid var(--stroke);
  border-radius: 22px;
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  display: flex; flex-direction: column;
  box-shadow: var(--shadow); overflow: hidden;
}
.chat-head {
  padding: 18px 20px;
  border-bottom: 1px solid var(--stroke);
  display: flex; align-items: center; gap: 12px;
}
.avatar-j {
  width: 38px; height: 38px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--cyan), var(--purple) 70%);
  box-shadow: 0 0 18px rgba(90,216,255,0.4);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; color: #021;
}
.avatar-j.active { animation: avatarPulse 1.4s ease-in-out infinite; }
@keyframes avatarPulse { 0%,100% { box-shadow: 0 0 18px rgba(90,216,255,0.4); }
                        50%      { box-shadow: 0 0 32px rgba(167,139,250,0.7); } }
.chat-head-info { flex: 1; }
.chat-head-info .name { font-size: 14px; font-weight: 600; }
.chat-head-info .sub  { font-size: 11px; color: var(--txt-mute); margin-top: 2px;
                        display: flex; align-items: center; gap: 6px; }
.chat-head-info .sub .dot { width: 6px; height: 6px; border-radius: 50%;
                            background: var(--green); box-shadow: 0 0 8px var(--green); }

#chat-area {
  flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column;
  gap: 10px;
  mask-image: linear-gradient(to bottom, transparent 0, #000 24px, #000 calc(100% - 16px), transparent 100%);
}
#chat-area::-webkit-scrollbar { width: 6px; }
#chat-area::-webkit-scrollbar-thumb { background: var(--glass-2); border-radius: 3px; }

.jb-msg { animation: msgIn .35s cubic-bezier(.4,0,.2,1); }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.jb-bubble { padding: 12px 14px; border-radius: 14px; max-width: 88%; font-size: 13.5px;
             line-height: 1.55; word-wrap: break-word; position: relative; }
.jb-bub-u { background: linear-gradient(135deg, rgba(90,216,255,0.18), rgba(167,139,250,0.12));
            border: 1px solid rgba(90,216,255,0.25); margin-left: auto;
            border-bottom-right-radius: 4px; }
.jb-bub-j { background: var(--glass-2); border: 1px solid var(--stroke);
            border-bottom-left-radius: 4px; }
.jb-name { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--cyan);
           text-transform: uppercase; }
.jb-bub-u .jb-name { color: var(--purple); }
.jb-ts { font-size: 9px; color: var(--txt-mute); margin-left: 8px; }
.jb-body { margin-top: 4px; color: var(--txt); white-space: pre-wrap; }
.jb-sys { text-align: center; font-size: 11px; color: var(--txt-mute); padding: 6px 12px;
          background: var(--glass-2); border-radius: 10px; display: inline-block;
          align-self: center; }

/* Voice & input */
.chat-foot { padding: 14px 16px; border-top: 1px solid var(--stroke); }
#voice-bar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
}
#mic-btn {
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  border: none; cursor: pointer; color: #021; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 22px rgba(90,216,255,0.4);
  transition: all .25s;
}
#mic-btn:hover { transform: scale(1.05); }
#mic-btn.jb-recording { background: linear-gradient(135deg, var(--pink), var(--orange));
                       animation: micRec 1s ease-in-out infinite; }
@keyframes micRec { 0%,100% { box-shadow: 0 6px 22px rgba(255,107,158,0.5); }
                    50%     { box-shadow: 0 6px 36px rgba(255,176,84,0.85); } }
.voice-info { flex: 1; font-size: 12px; color: var(--txt-mute); }
.voice-info b { color: var(--txt); display: block; font-size: 12px; font-weight: 600;
                margin-bottom: 2px; }
#mode-badge { color: var(--cyan); font-weight: 600; }
#input-bar { display: flex; align-items: center; gap: 8px;
             background: var(--glass-2); border: 1px solid var(--stroke);
             border-radius: 14px; padding: 4px 4px 4px 14px;
             transition: border-color .2s; }
#input-bar:focus-within { border-color: var(--cyan);
                          box-shadow: 0 0 0 3px rgba(90,216,255,0.1); }
#msg-input { flex: 1; background: transparent; border: none; outline: none;
             color: var(--txt); font-size: 13px; font-family: inherit; padding: 10px 4px; }
#msg-input::placeholder { color: var(--txt-mute); }
#send-btn { width: 36px; height: 36px; border-radius: 10px; border: none; cursor: pointer;
            background: var(--cyan); color: #021; font-weight: 800; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: all .2s; }
#send-btn:hover { background: var(--purple); color: #fff; transform: translateX(2px); }

/* Setup banner */
#setup-banner {
  display: none;
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, rgba(255,176,84,0.18), rgba(255,107,158,0.18));
  border: 1px solid rgba(255,176,84,0.4); border-radius: 14px;
  padding: 10px 18px; z-index: 99; backdrop-filter: blur(20px);
  display: flex; align-items: center; gap: 14px; font-size: 13px;
  box-shadow: var(--shadow);
}
#setup-banner button { background: var(--orange); color: #021; border: none;
                       padding: 6px 14px; border-radius: 8px; font-weight: 700;
                       cursor: pointer; font-size: 12px; }

/* Modal de tema (picker mínimo) */
#theme-modal {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  align-items: center; justify-content: center;
}
#theme-modal.open { display: flex; }
.tm-card {
  width: min(720px, 92vw); background: var(--bg-mid);
  border: 1px solid var(--stroke-hi); border-radius: 24px;
  padding: 28px; box-shadow: var(--shadow);
}
.tm-card h2 { font-size: 18px; margin-bottom: 6px; }
.tm-card p  { color: var(--txt-mute); font-size: 13px; margin-bottom: 22px; }
.tm-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
.tm-opt {
  padding: 18px; border-radius: 16px; cursor: pointer;
  background: var(--glass-2); border: 1px solid var(--stroke);
  transition: all .2s;
}
.tm-opt:hover { border-color: var(--cyan); transform: translateY(-2px); }
.tm-opt.active { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(90,216,255,0.25); }
.tm-opt h3 { font-size: 14px; margin-bottom: 4px; }
.tm-opt small { color: var(--txt-mute); font-size: 11px; }
.tm-close { margin-top: 18px; padding: 8px 18px; background: transparent;
            color: var(--txt-mute); border: 1px solid var(--stroke); border-radius: 8px;
            cursor: pointer; }
</style>
</head>
<body>

<!-- Banner de setup (chaves faltando) -->
<div id="setup-banner">
  <span>⚠ Algumas credenciais ainda não foram configuradas.</span>
  <button onclick="openSetupTab()">Configurar agora</button>
</div>

<div id="shell">

  <!-- RAIL ESQUERDO -->
  <aside id="rail">
    <div class="rail-logo">J</div>
    <button class="rail-btn active" title="Dashboard" onclick="macosNav('dashboard')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5z"/></svg>
    </button>
    <button class="rail-btn" title="Histórico" onclick="macosNav('history')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </button>
    <button class="rail-btn" title="Alarmes" onclick="macosNav('alarmes')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <button class="rail-btn" title="Áudio" onclick="macosNav('audio')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/></svg>
    </button>
    <button class="rail-btn" title="Setup de chaves" onclick="macosNav('setup')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4"/><path d="M18 5l2 2"/><path d="M15 8l2 2"/></svg>
    </button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" title="Trocar tema" onclick="macosNav('theme')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2a10 10 0 1 0 0 20 2 2 0 0 0 2-2v-1a2 2 0 0 1 2-2h2.5a3.5 3.5 0 0 0 3.5-3.5A10 10 0 0 0 12 2z"/></svg>
    </button>
    <button class="rail-btn" title="Configurações" onclick="openSettings()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </aside>

  <!-- TOPBAR -->
  <header id="topbar">
    <div class="greet" id="greet-text">Boa tarde, Senhor<small>Sistema operacional.</small></div>
    <div class="topbar-spacer"></div>
    <div class="status-pill"><span class="status-dot"></span><span id="status-text">Online</span></div>
    <div class="mono clock" id="clock">--:--</div>
    <button class="btn-icon" title="Minimizar" onclick="pyApi('minimize_window')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="btn-icon" title="Guia de Setup / Ajuda" onclick="openSetupGuide()">?</button>
    <button class="btn-icon" title="Configurações" onclick="openSettings()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <!-- MAIN -->
  <section id="main">

    <!-- Sistema -->
    <div class="card">
      <div class="card-head">

      </div>

        <div class="ring-wrap">

        <button class="qa-btn" onclick="pyApi('send_message','agenda')">

          <span>Agenda</span>
        </button>
        <button class="qa-btn" onclick="pyApi('send_message','tocar música')">

  <aside id="chat-panel">

        <div class="sub"><span class="dot"></span><span id="mic-state">Aguardando</span></div>
      </div>
      <div id="timer-text" class="mono" style="font-size:12px;color:var(--cyan)"></div>
    </div>
    <div id="chat-area"></div>
    <div class="chat-foot">
      <div id="voice-bar">
        <button id="mic-btn" onclick="pyApi('toggle_mic')" title="Microfone">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/></svg>

    </div>

</div>

<script>document.body.dataset.theme = 'macos';</script>
<script src="../core/jarvis-bridge.js"></script>
<script>
/* Saudação dinâmica */
(function(){
  const h = new Date().getHours();
  const sal = h < 6 ? 'Boa madrugada' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  const el = document.getElementById('greet-text');
  if (el) el.firstChild.nodeValue = sal + ', Senhor';
})();

/* Relógio */
function _tickClock() {
  const d = new Date();
  const el = document.getElementById('clock');
  if (el) el.textContent = String(d.getHours()).padStart(2,'0') + ':' +
                            String(d.getMinutes()).padStart(2,'0');
}
_tickClock(); setInterval(_tickClock, 30000);
</script>
